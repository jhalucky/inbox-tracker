[alembic]
script_location = app/db/alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# sqlalchemy.url is set from DATABASE_URL in env.py
sqlalchemy.url = postgresql+psycopg://inboxguard:inboxguard@localhost:5434/inboxguard

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
