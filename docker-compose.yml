services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: inboxguard
      POSTGRES_PASSWORD: inboxguard
      POSTGRES_DB: inboxguard
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inboxguard -d inboxguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
